esphome:
  name: air-quality-external
  friendly_name: Air Quality External

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

ota:
  - platform: esphome
    password: "00000000000000000000000000000000"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Air-Quality-External"
    password: "test-only-not-real"

captive_portal:

uart:
  tx_pin: GPIO12
  rx_pin: GPIO13
  baud_rate: 9600

sensor:
  - platform: pmsx003
    type: PMSX003
    pm_1_0:
      name: "Particulate Matter <1.0µm Concentration"
    pm_2_5:
      name: "Particulate Matter <2.5µm Concentration"
    pm_10_0:
      name: "Particulate Matter <10.0µm Concentration"
  - platform: dht
    pin: GPIO2
    temperature:
      name: "Air quality meter Temperature"
    humidity:
      name: "Air quality meter Humidity"
    update_interval: 20s

switch:
  - platform: gpio
    pin:
      number: GPIO0
    id: pms_set
    name: "Start measuring"
    restore_mode: ALWAYS_OFF

interval:
  - interval: 120s
    then:
      - switch.turn_on: pms_set
      - delay: 20s
      - switch.turn_off: pms_set

button:
  - platform: safe_mode
    name: Safe Mode Boot
    entity_category: diagnostic
