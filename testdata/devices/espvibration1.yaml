esphome:
  name: espvibration1

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.0"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Espvibration1 Fallback Hotspot"
    password: "test-only-not-real"

logger:

api:
  encryption:
    key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

ota:
  platform: esphome
  password: "00000000000000000000000000000000"

captive_portal:

sensor:
  - platform: wifi_signal
    name: "ESPVibration1 WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "ESPVibration1 Uptime"
    update_interval: 60s

status_led:
  pin: GPIO2

binary_sensor:
  - platform: gpio
    name: "Dryer"
    pin:
      number: GPIO13
      mode: INPUT
    device_class: vibration
    filters:
      - delayed_on: 10ms
      - delayed_off: 2min
