substitutions:
  hostname: "ocamera"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

esphome:
  name: $hostname

psram:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True
  ap:
    ssid: "Ocamera Fallback Hotspot"
    password: "test-only-not-real"

logger:

# No api.encryption.key — tests the parseAPIKey empty-return path
api:
  reboot_timeout: 0s

web_server:
  port: 80

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: homeassistant_time

esp32_camera:
  external_clock:
    pin: GPIO0
    frequency: 10MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 1024x768
  jpeg_quality: 10
  max_framerate: 2fps
  idle_framerate: 0.1fps
  name: ocamera

output:
  - platform: gpio
    pin: GPIO4
    id: gpio_4

light:
  - platform: binary
    output: gpio_4
    name: $hostname light

captive_portal:

button:
  - platform: safe_mode
    name: Safe Mode Boot
    entity_category: diagnostic
